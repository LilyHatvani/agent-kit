name: ci

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Every package built here is 0.1.<run number> (Directory.Build.props).
  AGENTKIT_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: build and test (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENTKIT_TEST_ADMIN_CONNECTION: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build AgentKit.slnx -c Release
      - run: dotnet test --project tests/AgentKit.McpOAuth.Tests -c Release --no-build
      - run: dotnet test --project tests/AgentKit.ProviderSignIn.Tests -c Release --no-build
      # Packing on every run surfaces packaging errors before any publish key exists.
      - run: dotnet pack AgentKit.slnx -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: publish to nuget.org
    needs: test
    # Trusted Publishing, no stored API key (owner, 2026-11-11): nuget.org trusts this workflow through GitHub's OIDC
    # token, under the owner's nuget.org policy (repository owner LilyHatvani, repository agent-kit, workflow ci.yml).
    # The repository variable NUGET_USER (the nuget.org profile name) switches it on; unset, this job is skipped.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Exchange the OIDC token for a short-lived nuget.org key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
